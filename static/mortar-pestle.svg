<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
  <title id="title">Traditional Ayurvedic mortar and pestle with medicinal leaves</title>
  <desc id="desc">A hand-carved stone mortar and wooden pestle surrounded by neem and tulsi leaves.</desc>
  <defs>
